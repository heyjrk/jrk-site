    title: Oracle
    label: Book One of the Multiverse Series
    hook: "Secret nanotechnology. Humans with incredible powers. One family's secret threatens to shatter the uneasy peace between worlds."
    facts: "January 8, 2019. 2nd edition. 326 pages. 4.5 out of 5 from 41 Amazon ratings."
    alt: "Cover of Oracle. A man in dark armor runs forward, a woman behind him, and a large portrait of an older man, against a glowing blue network and a city on the horizon."
    kindle: https://www.amazon.com/dp/B07MC5J3CB
    paperback: https://www.amazon.com/dp/1792703198
    audiobook: https://www.amazon.com/dp/B0F3GX43SQ
    grafs:
      - "Desmond Bishop is struggling with his recent retirement from the Gaian Defense Agency, when his daughter, Celia, calls him out of the blue."
      - "Multiple kidnappings have taken place overnight in what appears to be a coordinated effort by agents of the Seventh Verse."
      - "For years, Desmond warned the GDA that an attack like this was possible, but they didn't want to listen. Now, he's more than content to let them clean up their own mess, but a sinister family secret drags him back into the fold."
      - "Together, Desmond and Celia must uncover the truth about the hidden menace that threatens to destroy their entire world and find a way to stop it before they lose everything they hold dear."
  - id: exiled
    title: Exiled
    label: Book Two of the Multiverse Series
    hook: "The Oculus has been destroyed, but the damage is already done."
    facts: ""
    alt: "Cover of Exiled. A man in dark armor runs through rubble with gold energy around his hands, a woman running behind him, and a ruined city under storm clouds."
    kindle: https://www.amazon.com/dp/B07MJVQM97
    paperback: https://www.amazon.com/dp/1793953465
    audiobook: https://www.amazon.com/dp/B0F3GYK71Z
    grafs:
      - "Gaia has been overrun by the Terran invasion. Hordes of Gaians are forced into massive internment camps where they are given a nanite treatment that will alter their genetic code and cut them off from the flux forever."
      - "On the run, Celia leads a small band of refugees through the countryside, trying to stay one step ahead of the Terran patrols and keep herself and her people free."
      - "After destroying the Oculus, Kid finds himself back on Gaia with several weeks missing from his memory. When he discovers a brand new ability tied together with powers beyond his control, he could very well be the key to victory against the Terrans. But first, he must learn to harness his raw potential from a mysterious stranger."
      - "With the military and government in shambles, Desmond must organize the resistance and find a way to turn the tide of the invasion and free his people before they are stripped of the very thing which makes them Gaian."
      - "Meanwhile, with each moment that passes, the true villain grows more and more powerful in the shadows, threatening both Gaian and Terran alike. Will Desmond, Celia, and Kid be able to turn back the Terran invasion and stop the emerging menace? Or will they be forced to choose between the people they love and an unspeakable fate?"
