<div class="buy" role="group" aria-label="Buy {{ .title }}">
  <a href="{{ .kindle }}" target="_blank" rel="noopener noreferrer" aria-label="Buy {{ .title }} for Kindle">Kindle</a>
  <a href="{{ .paperback }}" target="_blank" rel="noopener noreferrer" aria-label="Buy {{ .title }} in paperback">Paperback</a>
  <a href="{{ .audiobook }}" target="_blank" rel="noopener noreferrer" aria-label="Buy the {{ .title }} audiobook">Audiobook</a>
  <p class="ku">Kindle edition is in Kindle Unlimited.</p>
</div>
